services:
  postgres:
    build:
      context: .
      dockerfile: db/Dockerfile.postgres
    restart: unless-stopped
    # Hostname on the compose network is `postgres`. Alias `db` covers EasyPanel templates
    # that set DATABASE_URL=...@db:5432/...
    networks:
      default:
        aliases:
          - db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-welcome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-welcome}
      POSTGRES_DB: ${POSTGRES_DB:-welcome_inn}
    # Internal only — app reaches Postgres via `postgres` or `db` (no host :5432 publish).
    # Local shell: docker compose exec postgres psql -U welcome -d welcome_inn
    expose:
      - "5432"
    volumes:
      - welcome_inn_pg:/var/lib/postgresql/data
    healthcheck:
      # Ready only after password sync flag is written by postgres-docker-entrypoint.sh
      test:
        [
          "CMD-SHELL",
          "test -f /tmp/postgres-password-synced && pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  welcome-inn:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    # Internal port only. EasyPanel proxies by domain → container :3000.
    # Do not publish host :3000 here — that causes "port is already allocated" on EasyPanel
    # when another service already binds 3000. For local access, see docker-compose.override.example.yml
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      # App builds DATABASE_URL from these (password synced into the volume on every Postgres start).
      POSTGRES_USER: ${POSTGRES_USER:-welcome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-welcome}
      POSTGRES_DB: ${POSTGRES_DB:-welcome_inn}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      # Optional override; ignored when POSTGRES_PASSWORD is set (entrypoint rebuilds the URL).
      DATABASE_URL: ${DATABASE_URL:-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_JWT_TTL: ${AUTH_JWT_TTL:-7d}
      # One-shot data import on container start (set to 0 after first successful migrate)
      MIGRATE_FROM_SUPABASE_ON_BOOT: ${MIGRATE_FROM_SUPABASE_ON_BOOT:-0}
      SUPABASE_DATABASE_URL: ${SUPABASE_DATABASE_URL:-}
      MIGRATE_TRUNCATE: ${MIGRATE_TRUNCATE:-0}
      # Do NOT set MIGRATE_DRY_RUN=1 on EasyPanel for real imports (counts only, no writes).
      MIGRATE_DRY_RUN: ${MIGRATE_DRY_RUN:-0}
      MIGRATE_ALLOW_DRY_RUN_ON_BOOT: ${MIGRATE_ALLOW_DRY_RUN_ON_BOOT:-0}
      TECHOSPITALITY_BASE_URL: ${TECHOSPITALITY_BASE_URL}
      TECHOSPITALITY_RESERVATIONS_TOKEN: ${TECHOSPITALITY_RESERVATIONS_TOKEN}
      TECHOSPITALITY_CHECKOUTS_TOKEN: ${TECHOSPITALITY_CHECKOUTS_TOKEN}
      TECHOSPITALITY_CREATED_TOKEN: ${TECHOSPITALITY_CREATED_TOKEN}
      TECHOSPITALITY_HUB_TOKEN: ${TECHOSPITALITY_HUB_TOKEN}
      TECHOSPITALITY_CHECKOUTS_PATH: ${TECHOSPITALITY_CHECKOUTS_PATH:-/api/reservations/checkouts}
      TECHOSPITALITY_CREATED_PATH: ${TECHOSPITALITY_CREATED_PATH:-/api/reservations/created}
      TECHOSPITALITY_DASHBOARD_FEED_LIMIT: ${TECHOSPITALITY_DASHBOARD_FEED_LIMIT:-20}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-sa-east-1}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-vivakey}
      AWS_S3_FORCE_PATH_STYLE: ${AWS_S3_FORCE_PATH_STYLE:-true}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_REGION: ${MINIO_REGION:-sa-east-1}
      MINIO_FORCE_PATH_STYLE: ${MINIO_FORCE_PATH_STYLE:-true}
      # Override no EasyPanel: sandbox = meucheckin.*; produção = checkin.*
      PUBLIC_CHECKIN_ORIGIN: ${PUBLIC_CHECKIN_ORIGIN:-https://meucheckin.audaar.com.br}
      ADMIN_PANEL_ORIGIN: ${ADMIN_PANEL_ORIGIN:-https://meucheckin.techospitality.com}
      ZEPIRIS_ENABLED: ${ZEPIRIS_ENABLED:-false}
      ZEPIRIS_ML_URL: ${ZEPIRIS_ML_URL:-https://photoguard.agentslabs.cloud}
      ZEPIRIS_API_KEY: ${ZEPIRIS_API_KEY:-}
      ZEPIRIS_TENANT: ${ZEPIRIS_TENANT:-}
      ZEPIRIS_TIMEOUT_MS: ${ZEPIRIS_TIMEOUT_MS:-10000}
      ZEPIRIS_UNAVAILABLE_POLICY: ${ZEPIRIS_UNAVAILABLE_POLICY:-BLOCK}
      # Cloudflare Turnstile (login staff). Needs site + secret at runtime.
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ZepIris ML Inference (opcional) — build a partir de https://github.com/zepto-labs/zepiris
  # docker compose --profile zepiris up -d
  zepiris-ml:
    profiles: ["zepiris"]
    image: zepiris-ml-inference:latest
    build:
      context: https://github.com/zepto-labs/zepiris.git
      dockerfile: ml_inference.Dockerfile
    ports:
      - "8001:8001"
    environment:
      ML_SERVICE_HOST: "0.0.0.0"
      ML_SERVICE_PORT: "8001"
      ML_SERVICE_ML_DEVICE: "cpu"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthz"]
      interval: 30s
      timeout: 30s
      retries: 5
    restart: unless-stopped

volumes:
  welcome_inn_pg:
