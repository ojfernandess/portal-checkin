services:
  welcome-inn:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      SUPABASE_PROJECT_ID: ${SUPABASE_PROJECT_ID}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      TECHOSPITALITY_BASE_URL: ${TECHOSPITALITY_BASE_URL}
      TECHOSPITALITY_RESERVATIONS_TOKEN: ${TECHOSPITALITY_RESERVATIONS_TOKEN}
      TECHOSPITALITY_CHECKOUTS_TOKEN: ${TECHOSPITALITY_CHECKOUTS_TOKEN}
      TECHOSPITALITY_CREATED_TOKEN: ${TECHOSPITALITY_CREATED_TOKEN}
      TECHOSPITALITY_HUB_TOKEN: ${TECHOSPITALITY_HUB_TOKEN}
      TECHOSPITALITY_CHECKOUTS_PATH: ${TECHOSPITALITY_CHECKOUTS_PATH:-/api/reservations/checkouts}
      TECHOSPITALITY_CREATED_PATH: ${TECHOSPITALITY_CREATED_PATH:-/api/reservations/created}
      TECHOSPITALITY_DASHBOARD_FEED_LIMIT: ${TECHOSPITALITY_DASHBOARD_FEED_LIMIT:-20}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-sa-east-1}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-vivakey}
      AWS_S3_FORCE_PATH_STYLE: ${AWS_S3_FORCE_PATH_STYLE:-true}
      PUBLIC_CHECKIN_ORIGIN: ${PUBLIC_CHECKIN_ORIGIN:-https://checkin.audaar.com.br}
      ADMIN_PANEL_ORIGIN: ${ADMIN_PANEL_ORIGIN:-https://checkin.techospitality.com}
      ZEPIRIS_ENABLED: ${ZEPIRIS_ENABLED:-false}
      ZEPIRIS_ML_URL: ${ZEPIRIS_ML_URL:-https://photoguard.agentslabs.cloud}
      ZEPIRIS_API_KEY: ${ZEPIRIS_API_KEY:-}
      ZEPIRIS_TIMEOUT_MS: ${ZEPIRIS_TIMEOUT_MS:-10000}
      ZEPIRIS_UNAVAILABLE_POLICY: ${ZEPIRIS_UNAVAILABLE_POLICY:-BLOCK}
    restart: unless-stopped

  # ZepIris ML Inference (opcional) — build a partir de https://github.com/zepto-labs/zepiris
  # docker compose --profile zepiris up -d
  zepiris-ml:
    profiles: ["zepiris"]
    image: zepiris-ml-inference:latest
    build:
      context: https://github.com/zepto-labs/zepiris.git
      dockerfile: ml_inference.Dockerfile
    ports:
      - "8001:8001"
    environment:
      ML_SERVICE_HOST: "0.0.0.0"
      ML_SERVICE_PORT: "8001"
      ML_SERVICE_ML_DEVICE: "cpu"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthz"]
      interval: 30s
      timeout: 30s
      retries: 5
    restart: unless-stopped
